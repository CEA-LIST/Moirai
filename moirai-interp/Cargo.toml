[package]
name = "moirai-interp"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "One log that merges any metamodel a MetamodelSemantics table can express"

[dependencies]
moirai-protocol = { path = "../moirai-protocol" }
moirai-crdt = { path = "../moirai-crdt" }
moirai-semantics = { path = "../moirai-semantics" }
moirai-network = { path = "../moirai-network", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0.128" }
# MOIRAI-FUZZ
moirai-fuzz = { path = "../moirai-fuzz", optional = true }
rand = { version = "0.10.0", optional = true }
# TEST UTILS FEATURES
deepsize = { git = "https://github.com/leo-olivier/deepsize.git", optional = true, features = [
    "elsa",
] }

[dev-dependencies]
rand_chacha = { version = "0.10.0" }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
] }
# NW.16a's loopback tests read Zenoh from outside the nodes: a raw session
# that must see a node's liveliness token at the port the node reported, and
# an observer of the frames nodes put. The same pin and features as
# `moirai-network`'s, so the lock gains no package.
zenoh = { version = "=1.10.1", default-features = false, features = ["transport_tcp", "unstable"] }

[[example]]
name = "model_node"
required-features = ["network"]

[[test]]
name = "si12_fixtures"
required-features = ["network"]

[[test]]
name = "si12_copy_migration"
required-features = ["network"]

[[test]]
name = "si12_copy_migration_l3"
required-features = ["network"]

[[test]]
name = "si12_scale_l3"
required-features = ["network"]

[[test]]
name = "si13_concurrent_migrations"
required-features = ["network"]

[[test]]
name = "si13_migration_l3"
required-features = ["network"]

[[test]]
name = "si13_copy_in_progress"
required-features = ["network"]

[[test]]
name = "si13_scale_l3"
required-features = ["network"]

[[test]]
name = "si14_fixtures"
required-features = ["network"]

[[test]]
name = "si14_rebase"
required-features = ["network"]

[[test]]
name = "si14_rebase_l3"
required-features = ["network"]

[[test]]
name = "si16_rebased_joiner"
required-features = ["network"]

[[test]]
name = "si16_rebased_joiner_l3"
required-features = ["network"]

[features]
# `serde` because the table travels inside the log (decision D2), `test_utils`
# because the PO-Log lengths of `ip11` are read through `IsLogTest`. Neither
# widens the workspace build: `moirai-network` already turns `serde` on and
# `moirai-crdt`'s own default turns `test_utils` on.
default = ["serde", "test_utils"]
serde = ["moirai-protocol/serde", "moirai-crdt/serde"]
# Forwarded to both crates at once: `IsLog::effect`'s arity is gated on each
# crate's own `sink` feature, so turning it on for one and not the other does
# not compile.
sink = ["moirai-protocol/sink", "moirai-crdt/sink"]
fuzz = ["dep:moirai-fuzz", "dep:rand", "test_utils", "moirai-semantics/deepsize"]
network = ["dep:moirai-network", "serde"]
test_utils = ["dep:deepsize", "moirai-protocol/test_utils", "moirai-crdt/test_utils"]
