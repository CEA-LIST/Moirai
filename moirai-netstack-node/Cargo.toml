[package]
name = "moirai-netstack-node"
edition = "2024"
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The node for moirai-netstack: hosts logs by id, filters frames for logs it does not host, applies ops and batches"

[dependencies]
moirai-netstack = { path = "../moirai-netstack" }
# Default features off: this crate's tests run on the direct transport, and a
# caller that wants Zenoh turns it on through the feature below.
moirai-netstack-transport = { path = "../moirai-netstack-transport", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
moirai-netstack-testkit = { path = "../moirai-netstack-testkit" }

[features]
default = []
zenoh = ["moirai-netstack-transport/zenoh"]
