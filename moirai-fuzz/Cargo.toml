[package]
name = "moirai-fuzz"
version = "0.8.1"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Fuzzer for the Moirai CRDT framework"
readme = "README.md"

[dependencies]
moirai-protocol = { path = "../moirai-protocol", features = [
    "test_utils",
    "serde",
] }
chrono = { version = "0.4.45" }
rand = { version = "0.10.3" }
log = "0.4"
comfy-table = { version = "8.0.1" }
indicatif = { version = "0.18.6" }
readable = { version = "0.16.0" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0.128" }
rand_chacha = { version = "0.10.0" }
rustc-hash = "2.1.3"
daggy = "0.9.0"
bimap = "0.6.3"
petgraph = "0.8.3"
# TEST UTILS FEATURES
deepsize = { git = "https://github.com/leo-olivier/deepsize.git", features = [
    "elsa",
] }

[features]
default = []
sink = ["moirai-protocol/sink"]
