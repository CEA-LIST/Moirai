[package]
name = "moirai-netstack-start"
edition = "2024"
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Starts a moirai-netstack node from the environment as 601c887's model_node does: ports and peers files, early HTTP bind, Zenoh with the NW.30 port-0 hold"

[dependencies]
moirai-netstack = { path = "../moirai-netstack" }
moirai-netstack-node = { path = "../moirai-netstack-node" }
moirai-netstack-http = { path = "../moirai-netstack-http" }
# Default features on: a launcher run with no feature flag runs Zenoh.
moirai-netstack-transport = { path = "../moirai-netstack-transport" }
serde_json = "1.0"

[dev-dependencies]
moirai-netstack-testkit = { path = "../moirai-netstack-testkit" }
