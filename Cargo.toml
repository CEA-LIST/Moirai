[workspace]
resolver = "3"
members = ["moirai-protocol", "moirai-crdt", "moirai-fuzz", "moirai-macros", "moirai-netstack", "moirai-netstack-testkit", "moirai-netstack-transport", "adapters/crdt", "moirai-netstack-node", "moirai-netstack-http", "moirai-netstack-router", "moirai-netstack-start"]
exclude = ["vendor"]

[workspace.package]
version = "0.8.3"
license = "Apache-2.0"
authors = ["Léo Olivier <leo.olivier@cea.fr>"]
repository = "https://github.com/CEA-LIST/Moirai.git"
homepage = "https://github.com/CEA-LIST/Moirai"
description = "Moirai: A Rust Implementation of the Pure Operation-Based CRDT Framework, made for Building Collaborative Applications"
readme = "README.md"
keywords = [
    "crdt",
    "conflict-free replicated data type",
    "collaborative applications",
    "distributed systems",
    "rust",
]
categories = []

[profile.release]
debug = true

[profile.samply]
inherits = "release"
debug = true

[patch.crates-io]
zenoh = { path = "vendor/zenoh-1.10.1" }
