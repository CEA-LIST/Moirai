[workspace]
resolver = "3"
members = [
    "moirai-protocol",
    "moirai-crdt",
    "moirai-fuzz",
    "moirai-macros",
    "moirai-network",
    "moirai-bootnode",
    "moirai-relay",
    "moirai-router",
    "moirai-semantics",
    "moirai-interp",
    "moirai-dashboard",
]
exclude = ["vendor"]

[workspace.package]
license = "Apache-2.0"
authors = ["Léo Olivier <leo.olivier@cea.fr>"]
repository = "https://github.com/CEA-LIST/Moirai.git"
homepage = "https://github.com/CEA-LIST/Moirai"
description = "Moirai: A Rust Implementation of the Pure Operation-Based CRDT Framework, made for Building Collaborative Applications"
readme = "README.md"
keywords = [
    "crdt",
    "conflict-free replicated data type",
    "collaborative applications",
    "distributed systems",
    "rust",
]
categories = []

[profile.release]
debug = true

[profile.samply]
inherits = "release"
debug = true

# zenoh 1.10.1 as published plus upstream commit 646f2d1b730e (eclipse-zenoh/zenoh
# PR #2779, the fix for issue #2581: a peer can wedge at start in the interest
# routing). NW.23's copy; it leaves out the crate's tests/ directory. Drop this
# entry and vendor/zenoh-1.10.1 once a zenoh release carries the fix.
[patch.crates-io]
zenoh = { path = "vendor/zenoh-1.10.1" }
