name: CI

# Format, lint and unit tests for the Moirai workspace.
#
# Only GitHub-published actions (actions/*) are used, so no third-party
# action needs to be vetted or pinned.

on:
  push:
    branches: [master, 26-network]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    # TODO(ci): flip to blocking once the formatting backlog is cleared.
    # Baseline on 26-network at the time this workflow was added: 49 files
    # are not rustfmt-clean. Landing `cargo fmt --all` is a separate,
    # mechanical PR so it stays reviewable on its own.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    # TODO(ci): flip to blocking (and add `-- -D warnings`) once the lint
    # backlog is cleared. Baseline on 26-network: 38 warnings.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install clippy
        run: rustup component add clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-clippy-
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - name: cargo build
        run: cargo build --workspace --all-targets
      - name: cargo test
        # `size_event_id` is skipped: it is a brittle memory-layout assertion
        # in moirai-protocol (src/event/id.rs) that hand-sums `deep_size_of()`
        # against a Vec of two clones using a hardcoded `size_rc = 8`. The Vec
        # side double-counts the ~2.6 KB Rc resolver shared by the clones, so
        # it reports left: 2662 / right: 5252. It is not a replication defect.
        # TODO(ci): drop this --skip once the assertion is fixed or #[ignore]d.
        run: cargo test --workspace -- --skip size_event_id
