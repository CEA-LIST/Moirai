name: Moirai CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly with rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Check workspace formatting
        run: >-
          cargo +nightly fmt --all -- --check --unstable-features
          --config imports_granularity=Crate,group_imports=StdExternalCrate

  features:
    name: Cargo Features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.46
      - run: cargo hack check --workspace --feature-powerset --locked

  tests:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Standard tests
            args: ""
          - check: Ignored tests and fuzzers
            args: --release -- --ignored --test-threads=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn
          cache-key: ${{ matrix.check }}
      - name: Run workspace tests and doctests
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
        run: >-
          cargo test --workspace --locked --no-fail-fast
          --features serde,test_utils
          ${{ matrix.args }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
          build-warnings: warn
      - run: cargo clippy --workspace --all-targets --all-features --locked
