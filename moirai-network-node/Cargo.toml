[package]
name = "moirai-network-node"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Small TCP runtime for Moirai replicas"

# Keep this crate independently buildable without changing the parent workspace.
[workspace]

[dependencies]
moirai-protocol = { path = "../moirai-protocol", features = ["serde", "test_utils"] }
deepsize = { git = "https://github.com/leo-olivier/deepsize.git" }
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
socket2 = { version = "0.6.5", features = ["all"] }

[profile.release]
debug = true
