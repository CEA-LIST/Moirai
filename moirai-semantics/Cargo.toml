[package]
name = "moirai-semantics"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The merge policy of a metamodel as pure data, parsed from an Arachne descriptor"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0.128" }
sha2 = "0.10"
smallvec = { version = "1.15.1", features = ["serde"] }
# Only for `moirai-interp`'s `fuzz` feature, which counts the parsed table in
# a sampled replica's deep size; off by default, so no other build sees it.
deepsize = { git = "https://github.com/leo-olivier/deepsize.git", optional = true, features = [
    "smallvec",
] }

[features]
deepsize = ["dep:deepsize"]
