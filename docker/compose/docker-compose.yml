# The rig: a bootnode, N replicas that were never told about each other, an
# observer that samples them into CSV, and — optionally — a live dashboard.
#
# There is no `PEERS` anywhere in this file. That is the point: every replica
# registers its own address with the directory, reads back the roster, and
# dials it. Membership is therefore something the run *has* rather than
# something it was configured with, which is what makes join and leave
# measurable.
#
# # Running it
#
# The image is the one the e2e harness already uses, and it carries all three
# binaries. Build it from the directory holding both checkouts:
#
#     docker build -f moirai/docker/e2e/Dockerfile -t moirai-json-crdt:test .
#
# Then, from this directory:
#
#     docker compose up -d --scale node=5
#     docker compose logs -f observer
#     cat runs/metrics.csv
#     docker compose down -v
#
# # Watching it, optionally
#
# The replicas run perfectly well with nobody watching, and the dashboard is a
# *second* command that does not touch them:
#
#     docker compose --profile dashboard up -d dashboard
#     xdg-open http://localhost:8090
#
# It works in that order — replicas first, dashboard afterwards — because
# reporting is outbound and retried with backoff. A replica whose POST fails
# because nothing is listening yet backs off and keeps going; when the
# dashboard appears, the next report reaches it and carries the replica's whole
# identity and state, so nothing has to be replayed and no replica is restarted.
# The same property is why the dashboard can be stopped and started again
# mid-run.
#
# For a rig with genuinely zero reporting overhead, blank the variable:
#
#     DASHBOARD_URL= docker compose up -d --scale node=5
#
# `DASHBOARD_URL` unset or empty means the replica starts no reporting thread,
# makes no request, and does not collect a delivery trace — see
# `moirai-network/src/dashboard.rs`. `experiments/t-dashboard-overhead/` is the
# measurement of what the difference costs.
#
# # Driving it
#
#     docker compose --profile load up -d driver          # 1 op/replica/tick
#
# or, for the seeded random workload the e2e suite's R1 replays:
#
#     docker compose exec -T dashboard moirai-dashboard --random \
#         --seed 7 --rate 5 --nodes http://moirai-node-1:8081,http://moirai-node-2:8081
#
# On a host whose login shell has stale group credentials, prefix with
# `sg docker -c "..."`.
#
# # Addressing a specific replica
#
# With `--scale` the containers are named `moirai-node-1` .. `moirai-node-N`
# and each replica's id is its own hostname, which is also how peers reach it.
# So:
#
#     docker compose exec --index 3 node curl -s localhost:8081/api/metrics
#     docker network disconnect moirai_session moirai-node-3      # E4: go silent
#     docker network connect moirai_session moirai-node-3         # and back
#
# # The relayed edge
#
# `docker compose up` brings up one replica, `islander`, on a second bridge and
# nowhere else. It shares no network with the `node` replicas, so there is no
# path between them in either direction — Docker will not even resolve the
# address the bootnode hands out. Everything that pair replicates goes through
# the relay, which is on both bridges.
#
# The demo:
#
#     docker compose exec -T node curl -s localhost:8081/api/metrics | jq .routes
#     # -> { "islander": "relayed", "moirai-node-2": "direct", ... }
#     docker compose exec -T relay curl -s localhost:7101/health
#     # -> {"sessions":N,"frames_in":..,"frames_out":..,..}
#
# and the control that makes it mean something:
#
#     docker compose stop relay
#     docker compose exec -T node curl -s -X POST localhost:8081/api/op -d '...'
#     docker compose exec -T islander curl -s localhost:8081/api/state
#     # -> unchanged, because there is no other path
#     docker compose start relay      # and it catches up
#
# For a rig with no relay at all, blank the address on the bootnode — the
# replicas are configured with nothing to change:
#
#     RELAY_ADDR= docker compose up -d
#
# `islander` is then permanently unreachable and reads `unreachable` in `routes`,
# which is the pre-relay behaviour made visible.
#
# # One network for the mesh, and what that costs
#
# The `node` replicas share a single user-defined bridge, so `docker network
# disconnect` severs one for real. It severs it from the observer too, because the
# control plane rides the same network. That is fine for E4, where the interesting
# curve is what happens to the *survivors*. It is not enough for E6, where both
# halves of a partition must keep writing: use the per-peer `POST /api/pause/<id>`
# on the replicas for that, or the island rig in
# `moirai-network/tests/e2e_convergence.rs`, which gives each replica a network of
# its own for exactly this reason.

name: moirai

x-image: &image ${MOIRAI_IMAGE:-moirai-json-crdt:test}

services:
  # Directory only. It never sees an operation and holds no model state, so it
  # can be restarted mid-run without any replica noticing beyond a failed poll.
  bootnode:
    image: *image
    command: ["moirai-bootnode"]
    environment:
      BOOTNODE_PORT: "7000"
      # Comfortably above the replicas' RECONCILE_SECS, so a live replica is
      # never dropped for being slow.
      BOOTNODE_TTL_SECS: "${BOOTNODE_TTL_SECS:-30}"
      # Where a pair with no route to each other can meet. This is the *only*
      # place a relay is configured: the replicas learn it from the roster, so
      # `RELAY_ADDR=` gives a rig with no relay at all and nothing else changes.
      RELAY_ADDR: "${RELAY_ADDR-relay:7100}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7000/health"]
      interval: 1s
      timeout: 2s
      retries: 60
    networks: [session, island]

  # Forwards frames between replicas that cannot open a direct connection.
  #
  # A separate service from the bootnode, not a convenience: the bootnode is
  # blob-blind — it sees routing and never model content — and that is what makes
  # hosting one acceptable. A relay is by definition a data path, so merging them
  # would end the ability to state it (C-D3). Same image, two processes.
  #
  # On both networks, because it has to be reachable from both sides of the pair
  # it is bridging.
  relay:
    image: *image
    command: ["moirai-relay"]
    environment:
      RELAY_PORT: "7100"
      RELAY_HTTP_PORT: "7101"
      # `frames_in` vs `frames_out` is where fan-out is visible: one broadcast to
      # N relayed peers must read as one in and N out.
      RELAY_VERBOSE: "${RELAY_VERBOSE-}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7101/health"]
      interval: 1s
      timeout: 2s
      retries: 60
    networks: [session, island]

  # Scale this: `docker compose up --scale node=5`.
  #
  # Every instance is identical. REPLICA_ID and ADVERTISE_ADDR both default to
  # the container's own hostname, which Docker's embedded DNS resolves on a
  # user-defined network, so scaling needs no per-instance configuration and no
  # entry in this file changes when N does.
  node:
    image: *image
    depends_on:
      bootnode:
        condition: service_healthy
    environment:
      LISTEN_PORT: "9001"
      HTTP_PORT: "8081"
      BOOTNODE_URL: "http://bootnode:7000"
      SESSION_ID: "${SESSION_ID:-compose}"
      RECONCILE_SECS: "${RECONCILE_SECS:-5}"
      # `-` rather than `:-`, so an explicitly empty `DASHBOARD_URL=` in the
      # environment wins and gives a rig with no reporting at all. Pointing at
      # a dashboard that is not running costs one failed outbound POST every
      # few seconds, which is what makes attaching one later a second command
      # rather than a restart.
      DASHBOARD_URL: "${DASHBOARD_URL-http://dashboard:8090}"
      PEERS: ""
      # Blanked deliberately. The image sets `REPLICA_ID=a` as a convenience
      # for `docker run`, and inheriting it here gave every scaled replica the
      # same id: five containers registered as `a`, the directory upserted them
      # onto one entry, and the roster never held more than one peer. Empty is
      # what makes the `:-` defaults below fire.
      REPLICA_ID: ""
      ADVERTISE_ADDR: ""
    # `$$` is Compose's escape for a literal `$`, so these expand inside the
    # container rather than on the host.
    entrypoint:
      - /bin/sh
      - -c
      - |
        REPLICA_ID="$${REPLICA_ID:-$$HOSTNAME}" \
        ADVERTISE_ADDR="$${ADVERTISE_ADDR:-$$HOSTNAME:$$LISTEN_PORT}" \
        exec network_node
    networks: [session]

  # One replica on the *island* network and nowhere else, so it has no route to
  # any of the `node` replicas and they have none to it. Everything it replicates
  # goes through the relay, which is what makes `docker compose up` demonstrate a
  # relayed edge instead of only being able to.
  #
  # Not part of `--scale node=N` on purpose: it is a different topology, not
  # another instance of the same one.
  islander:
    image: *image
    depends_on:
      bootnode:
        condition: service_healthy
      relay:
        condition: service_healthy
    environment:
      REPLICA_ID: "islander"
      LISTEN_PORT: "9001"
      HTTP_PORT: "8081"
      BOOTNODE_URL: "http://bootnode:7000"
      SESSION_ID: "${SESSION_ID:-compose}"
      RECONCILE_SECS: "${RECONCILE_SECS:-5}"
      DASHBOARD_URL: "${DASHBOARD_URL-http://dashboard:8090}"
      PEERS: ""
      # The address it advertises resolves on `island` and nowhere else, which is
      # what makes the absence of a route real rather than assumed: a `node`
      # replica cannot even look this name up.
      ADVERTISE_ADDR: "islander:9001"
    networks: [island]

  # Samples every replica the directory knows about, into runs/metrics.csv.
  observer:
    image: *image
    depends_on:
      bootnode:
        condition: service_healthy
    environment:
      BOOTNODE_URL: "http://bootnode:7000"
      SESSION_ID: "${SESSION_ID:-compose}"
      HTTP_PORT: "8081"
      INTERVAL_SECS: "${INTERVAL_SECS:-1}"
      OUT: "/out/metrics.csv"
    entrypoint: ["/bin/sh", "/observer/observe.sh"]
    # Read-only mount rather than baked into the image: the sampling can change
    # without a rebuild, and a rebuild would change the replica binary too.
    volumes:
      - ./observe.sh:/observer/observe.sh:ro
      - ${MOIRAI_RUN_DIR:-./runs}:/out
    # The image's healthcheck curls a replica HTTP API this container does not
    # serve; without this it would sit `unhealthy` forever.
    healthcheck:
      disable: true
    networks: [session, island]

  # Applies one operation per replica per tick. Off by default; bring it up
  # with `docker compose --profile load up -d`.
  #
  # A measurement run needs *every* replica writing — see the header of
  # drive.sh — so this is not an optional nicety for E4, it is what makes the
  # baseline comparable.
  driver:
    image: *image
    profiles: [load]
    depends_on:
      bootnode:
        condition: service_healthy
    environment:
      BOOTNODE_URL: "http://bootnode:7000"
      SESSION_ID: "${SESSION_ID:-compose}"
      HTTP_PORT: "8081"
      OP_INTERVAL_SECS: "${OP_INTERVAL_SECS:-1}"
    entrypoint: ["/bin/sh", "/driver/drive.sh"]
    volumes:
      - ./drive.sh:/driver/drive.sh:ro
    healthcheck:
      disable: true
    networks: [session, island]

  # The live view. Off by default — "optionally connected" is the requirement,
  # and a rig that needs its monitoring to run is not optional.
  #
  # It binds a port and the replicas do not: they dial *out* to it. That is not
  # a Compose convenience, it is the deployment this system targets — replicas
  # are peers on laptops behind NAT, which is the same reason the architecture
  # has a bootnode with a relay fallback. A dashboard that had to dial into
  # every replica would work here and nowhere else.
  dashboard:
    image: *image
    profiles: [dashboard]
    command: ["moirai-dashboard", "--port", "8090"]
    ports:
      - "${DASHBOARD_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/api/health"]
      interval: 1s
      timeout: 2s
      retries: 60
    # On both, so `islander` can report too. Being on two bridges does not make
    # this a route between them: Docker does not forward between user-defined
    # networks, which is exactly why the replicas on either side still cannot
    # reach each other.
    networks: [session, island]

networks:
  session:
    name: moirai_session
    driver: bridge
  # The bootnode and the relay are on both; `islander` is on this one only. Two
  # bridges with no shared member between `islander` and the `node` replicas is
  # what gives the pair genuinely no path — Docker will not resolve the name and
  # would not route the packet if it did.
  island:
    name: moirai_island
    driver: bridge
