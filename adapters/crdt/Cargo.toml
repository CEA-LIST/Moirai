[package]
name = "moirai-netstack-crdt"
edition = "2024"
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "moirai-netstack's replica port over Moirai's own replicas"

[dependencies]
moirai-netstack = { path = "../../moirai-netstack" }
moirai-protocol = { path = "../../moirai-protocol" }
# serde: ops are the serde JSON of the CRDT's updates; no fuzz machinery.
moirai-crdt = { path = "../../moirai-crdt", default-features = false, features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
moirai-netstack-node = { path = "../../moirai-netstack-node" }
moirai-netstack-testkit = { path = "../../moirai-netstack-testkit" }
moirai-netstack-transport = { path = "../../moirai-netstack-transport", default-features = false }
