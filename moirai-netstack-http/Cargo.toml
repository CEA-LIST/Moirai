[package]
name = "moirai-netstack-http"
edition = "2024"
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "HTTP API for moirai-netstack: the generic routes over a Node, with an extension point for an application's own"

[dependencies]
moirai-netstack = { path = "../moirai-netstack" }
moirai-netstack-node = { path = "../moirai-netstack-node" }
# Default features off: the HTTP crate's closure builds without zenoh.
moirai-netstack-transport = { path = "../moirai-netstack-transport", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 601c887's server; it is in the registry cache, so it resolves offline.
tiny_http = "0.12"

[dev-dependencies]
moirai-netstack-testkit = { path = "../moirai-netstack-testkit" }
