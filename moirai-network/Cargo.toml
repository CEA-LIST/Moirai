[package]
name = "moirai-network"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Network replica binary for distributed Moirai CRDT replicas"

[lib]
name = "moirai_network"
path = "src/lib.rs"

[dependencies]
moirai-crdt = { path = "../moirai-crdt", features = ["serde"] }
moirai-protocol = { path = "../moirai-protocol", features = ["serde"] }
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
# `unbounded_depth` for one call, the op ingest. An interpreted `ModelOp`
# carries its whole path from the model root, so an operation on an element at
# containment depth 24 — which a real SysML v2 model reaches — nests past
# `serde_json`'s default recursion limit of 128 and is answered `400 Invalid op
# JSON`. `Api::submit` lifts the limit for that one body and for nothing else.
serde_json = { version = "1.0.133", features = ["unbounded_depth"] }
tiny_http = "0.12"
# The state transfer's `log` field is compressed, and only that field: the relay
# copies `msg` through as a `RawValue` without parsing it (`routing.rs`), so
# compressing the frame would end that guarantee while compressing the field
# leaves it untouched. `rust_backend` is `miniz_oxide`, so this stays a pure-Rust
# build and the container image needs no C toolchain it does not already have.
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
# Already in the tree via `reqwest`; named here because this crate now uses it
# directly. Deflate output is binary and a `TransportMessage` is a line of JSON.
base64 = "0.22"
# The size of what a node holds per hosted log, for the model plane's M-E2
# measurement (`experiments/mp2-dispatch-cost/` in the vault) and nothing else:
# optional, so
# the shipped binary never carries it. The same fork and features as
# `moirai-protocol`, which derives `DeepSizeOf` on the causal bookkeeping this
# measures.
deepsize = { git = "https://github.com/leo-olivier/deepsize.git", optional = true, features = [
    "elsa",
], }
# `blocking` keeps every call site a plain function: no runtime to set up, and
# both users — the e2e harness and the bootnode poll thread in `discovery.rs`
# — are sequences of request/poll steps. This was a dev-dependency until
# discovery needed an HTTP client at run time.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
] }
# The Zenoh transport (NW.14 note, vault `spec/Zenoh transport, peer-to-peer
# and router.md`), chosen at run time by `MOIRAI_TRANSPORT=zenoh`. Pinned
# exactly, because `unstable` is on: it is there for one call,
# `session.info().locators()`, the port Zenoh holds after a bind to 0. Default
# features off: they bring QUIC, UDP (quinn, rustls), WebSocket, TLS and
# public-key authentication, none of which Moirai uses; TCP is the one link.
zenoh = { version = "=1.10.1", default-features = false, features = ["transport_tcp", "unstable"], optional = true }

[features]
# `zenoh` on by default; `--no-default-features` builds a TCP-only library.
default = ["zenoh"]
zenoh = ["dep:zenoh"]
# The measurement surface: deep sizes of the hosted logs and the check that
# they hold one member table. Named like the sibling crates' feature, and off
# by default for the same reason.
test_utils = ["dep:deepsize", "moirai-protocol/test_utils", "moirai-crdt/test_utils"]

# Dev-only: `testcontainers` is a test harness, not a library dependency. No
# async reaches the library's API — the whole codebase is synchronous — though
# a runtime does run underneath where a feature needs one: `reqwest`'s
# `blocking` client, and Zenoh's own pools, reached only through `Wait::wait`.
# The `blocking` feature is `testcontainers`' sync runner, which keeps the
# harness a sequence of plain function calls like everything around it.
#
# `bollard` and `tokio` are not extra dependencies: `testcontainers` already
# brings both, and they are named here only so the harness can use the one
# operation the container library does not expose — attaching a container to a
# *second* network, which is what makes a partition genuine while leaving the
# replica observable. See the backend's header.
[dev-dependencies]
anyhow = "1.0"
bollard = "0.20"
serde_json = "1.0.133"
# The model plane's digest rule, so a scenario can name a metamodel by digest
# — including one the node under test does not hold, which no listing can
# tell it. Dev-only: the library never computes a digest, it compares keys.
sha2 = "0.10"
testcontainers = { version = "0.27", features = ["blocking"] }
tokio = { version = "1", features = ["rt"] }
