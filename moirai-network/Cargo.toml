[package]
name = "moirai-network"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Network replica binary for distributed Moirai CRDT replicas"

[lib]
name = "moirai_network"
path = "src/lib.rs"

[dependencies]
moirai-crdt = { path = "../moirai-crdt", features = ["serde"] }
moirai-protocol = { path = "../moirai-protocol", features = ["serde"] }
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.133"
tiny_http = "0.12"
# `blocking` keeps every call site a plain function: no runtime to set up, and
# both users — the e2e harness and the bootnode poll thread in `discovery.rs`
# — are sequences of request/poll steps. This was a dev-dependency until
# discovery needed an HTTP client at run time.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
] }

[dev-dependencies]
anyhow = "1.0"
serde_json = "1.0.133"
