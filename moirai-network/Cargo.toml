[package]
name = "moirai-network"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Network replica binary for distributed Moirai CRDT replicas"

[lib]
name = "moirai_network"
path = "src/lib.rs"

[dependencies]
moirai-crdt = { path = "../moirai-crdt", features = ["serde"] }
moirai-protocol = { path = "../moirai-protocol", features = ["serde"] }
rustc-hash = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.133"
tiny_http = "0.12"

[dev-dependencies]
anyhow = "1.0"
# `blocking` keeps the e2e tests plain `#[test]` functions: no runtime to set
# up, and the harness is a sequence of request/poll steps anyway.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",
] }
serde_json = "1.0.133"
